<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🫀 Aorta Interativa</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background: linear-gradient(135deg,#0B2545,#0f3a52);
  color:white;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  margin:5px;
  cursor:pointer;
}

.success{background:#22c55e}
.danger{background:#ef4444}
.info{background:#3b82f6}
.warning{background:#f59e0b;color:black}

.result{
  margin-top:10px;
  padding:15px;
  border-radius:8px;
  background:rgba(255,255,255,0.1);
}

img{
  width:100%;
  border-radius:10px;
}

/* mapa */
.mapa{
  position:relative;
}

.hotspot{
  position:absolute;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  cursor:pointer;
}

/* posições */
.deg{top:10%;right:5%;background:#3b82f6}
.bic{top:25%;right:5%;background:#f59e0b;color:black}
.mar{top:45%;right:15%;background:#a855f7}
.loe{top:60%;right:10%;background:#22c55e;color:black}
.tur{top:75%;right:8%;background:#ef4444}

</style>
</head>

<body>

<div class="container">

<h1>🫀 Aorta Interativa</h1>

<div class="card">
<h2>Dissecção</h2>

<img src="stanford_na_mao.png">

<p>Pegou a aorta ascendente?</p>

<button class="success" onclick="stanford('A')">SIM</button>
<button class="danger" onclick="stanford('B')">NÃO</button>

<div id="resStanford" class="result"></div>
</div>

<div class="card">
<h2>Aneurisma</h2>

<p>Tem síndrome?</p>

<button class="success" onclick="aneurisma(true)">SIM</button>
<button class="danger" onclick="aneurisma(false)">NÃO</button>

<div id="resAneurisma" class="result"></div>
</div>

<div class="card">
<h2>Modo Prova</h2>

<div class="mapa">

<img src="stanford_na_mao.png">

<button class="hotspot deg" onclick="quiz('deg')">Deg</button>
<button class="hotspot bic" onclick="quiz('bic')">Bic</button>
<button class="hotspot mar" onclick="quiz('mar')">Marfan</button>
<button class="hotspot loe" onclick="quiz('loe')">Loeys</button>
<button class="hotspot tur" onclick="quiz('tur')">Turner</button>

</div>

<div id="resMapa" class="result"></div>

</div>

</div>

<script>

function stanford(tipo){
  let r = document.getElementById('resStanford');
  if(tipo==='A'){
    r.innerHTML="✅ Stanford A → cirurgia";
  }else{
    r.innerHTML="🧠 Stanford B → clínico";
  }
}

function aneurisma(sim){
  let r = document.getElementById('resAneurisma');
  if(!sim){
    r.innerHTML="👉 5,5 cm";
  }else{
    let s = prompt("Qual síndrome? (marfan/loeys/turner/bicuspide)");
    if(!s) return;

    if(s.includes("marfan")) r.innerHTML="Marfan → 5,0 cm";
    else if(s.includes("loeys")) r.innerHTML="Loeys → 4,0–4,5 cm";
    else if(s.includes("turner")) r.innerHTML="Turner → 2,5 cm/m²";
    else r.innerHTML="Bicúspide → 5,5 / 5,0 / 4,5";
  }
}

function quiz(tipo){
  let respostas = {
    deg:"5.5",
    bic:"5.5",
    mar:"5.0",
    loe:"4.0",
    tur:"2.5"
  };

  let resp = prompt("Qual corte?");
  let r = document.getElementById('resMapa');

  if(!resp) return;

  if(resp.includes(respostas[tipo])){
    r.innerHTML="✅ Acertou!";
  }else{
    r.innerHTML="❌ Errou → correto: "+respostas[tipo];
  }
}

</script>

</body>
</html>
