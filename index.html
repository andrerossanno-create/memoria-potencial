<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Mental André Rossanno</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0f1a;
    color:white;
    text-align:center;
}

h1{
    margin:30px 0 10px;
    font-size:28px;
}

p{
    color:#aaa;
    margin-bottom:30px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    padding:20px;
}

.card{
    padding:30px;
    border-radius:15px;
    text-decoration:none;
    color:white;
    font-weight:bold;
    font-size:16px;
    box-shadow:0 10px 20px rgba(0,0,0,0.4);
    transition:0.2s;
}

.card:hover{
    transform:scale(1.05);
}

.stanford{
    background:linear-gradient(45deg,#ff416c,#ff4b2b);
}

.turner{
    background:linear-gradient(45deg,#7c3aed,#4f46e5);
}

.iam{
    background:linear-gradient(45deg,#f7971e,#ffd200);
}

.fa{
    background:linear-gradient(45deg,#00c6ff,#0072ff);
}

.choque{
    background:linear-gradient(45deg,#11998e,#38ef7d);
}

</style>
</head>

<body>

<h1>🧠 Atlas Mental Interativo</h1>
<p>Clique no tema para entrar no modo prova</p>

<a href="stanford.html" class="card stanford">

</a>

</div>

</body>
</html>
